<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛰️ God's Eye View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0c29;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            direction: rtl;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .map {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-content {
            text-align: center;
            font-size: 100px;
        }

        .info-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            border-left: 4px solid #667eea;
        }

        .sidebar {
            width: 350px;
            background: #1a1a2e;
            border-left: 3px solid #667eea;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar h2 {
            color: #667eea;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: 2px solid #667eea;
            border-radius: 5px;
            background: #2d2d44;
            color: #fff;
            font-size: 12px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #764ba2;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .section {
            background: #2d2d44;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .section h3 {
            color: #9da5f5;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .item {
            background: #3d3d54;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 8px;
            font-size: 12px;
            cursor: pointer;
            border-left: 3px solid #51cf66;
            transition: 0.3s;
        }

        .item:hover {
            background: #4d4d64;
        }

        .item.high {
            border-left-color: #ff6b6b;
        }

        .item-title {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .item-info {
            color: #bbb;
            font-size: 11px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 10px;
            margin-top: 5px;
            font-weight: bold;
            color: white;
        }

        .badge-high {
            background: #ff6b6b;
        }

        .badge-medium {
            background: #ffa94d;
        }

        .badge-low {
            background: #51cf66;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat {
            background: #667eea;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 11px;
            color: #ddd;
            margin-top: 5px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2d2d44;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="map">
            <div>
                <div class="map-content">🗺️</div>
                <div style="font-size: 16px; margin-top: 10px;">خريطة الأقمار الصناعية الحية</div>
            </div>
            <div class="info-box">
                <strong>🛰️ God's Eye View</strong><br>
                منصة مراقبة الأقمار الصناعية<br>
                البيانات: محدثة الآن
            </div>
        </div>

        <div class="sidebar">
            <h2>🔍 لوحة التحكم</h2>

            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="entityCount">5</div>
                    <div class="stat-label">كيانات</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="threatCount">3</div>
                    <div class="stat-label">تهديدات</div>
                </div>
            </div>

            <div class="input-group">
                <input type="text" id="search" placeholder="ابحث عن موقع...">
                <button onclick="search()">🔍 بحث</button>
                <button onclick="refresh()">🔄 تحديث</button>
                <button onclick="toggleAlerts()">⚠️ تنبيهات</button>
            </div>

            <div class="section">
                <h3>🚢 الكيانات المكتشفة</h3>
                <div id="entitiesContainer"></div>
            </div>

            <div class="section" id="alertsSection" style="display:none;">
                <h3>⚠️ التنبيهات النشطة</h3>
                <div id="alertsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const entities = [
            { id: 1, name: 'سفينة شحن ألفا', type: 'سفينة', speed: '15.5', threat: 'low', icon: '🚢' },
            { id: 2, name: 'رحلة جوية 123', type: 'طائرة', speed: '450', threat: 'low', icon: '✈️' },
            { id: 3, name: 'منشأة عسكرية', type: 'منشأة', threat: 'high', icon: '🏢' },
            { id: 4, name: 'سفينة غير محددة', type: 'سفينة', speed: '0', threat: 'high', icon: '🚢' },
            { id: 5, name: 'طائرة بدون طيار', type: 'طائرة', speed: '120', threat: 'medium', icon: '🛩️' }
        ];

        const alerts = [
            { id: 1, title: 'نشاط غير عادي', desc: 'انحراف السفينة عن المسار', time: 'الآن' },
            { id: 2, title: 'اختراق منطقة', desc: 'دخول منطقة محظورة', time: 'قبل دقيقة' },
            { id: 3, title: 'تغيير النشاط', desc: 'تغيير كبير في النشاط', time: 'قبل 5 دقائق' }
        ];

        function loadEntities() {
            const html = entities.map(e => `
                <div class="item ${e.threat === 'high' ? 'high' : ''}">
                    <div class="item-title">${e.icon} ${e.name}</div>
                    <div class="item-info">النوع: ${e.type}</div>
                    ${e.speed ? `<div class="item-info">السرعة: ${e.speed}</div>` : ''}
                    <div class="badge badge-${e.threat}">
                        ${e.threat === 'high' ? '🔴 عالية' : e.threat === 'medium' ? '🟡 متوسطة' : '🟢 منخفضة'}
                    </div>
                </div>
            `).join('');
            document.getElementById('entitiesContainer').innerHTML = html;
            document.getElementById('entityCount').textContent = entities.length;
            document.getElementById('threatCount').textContent = entities.filter(e => e.threat !== 'low').length;
        }

        function loadAlerts() {
            const html = alerts.map(a => `
                <div class="item">
                    <div class="item-title">⚠️ ${a.title}</div>
                    <div class="item-info">${a.desc}</div>
                    <div class="item-info" style="color:#999;">${a.time}</div>
                </div>
            `).join('');
            document.getElementById('alertsContainer').innerHTML = html;
        }

        function search() {
            const q = document.getElementById('search').value;
            if (!q) { alert('أدخل اسم موقع'); return; }
            alert('البحث عن: ' + q + '\n\nتم العثور على النتائج!');
        }

        function refresh() {
            loadEntities();
            alert('✅ تم تحديث البيانات بنجاح!');
        }

        function toggleAlerts() {
            const section = document.getElementById('alertsSection');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
            if (section.style.display === 'block') loadAlerts();
        }

        loadEntities();
    </script>
</body>
</html>
